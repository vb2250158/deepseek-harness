- id: tool-fs-search
  disabled: true

- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: hooks-claude-code
  disabled: true

- id: hooks-codex
  disabled: true

- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: system-prompt
  config:
    personaPrefix: 'Complete the deterministic context-admission scenario.'
    includeHarnessIdentity: false
    includeRuntimeContext: false

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    auto: true
    thresholdRatio: 0.5
    headroomTokens: 0
    retainTokens: 20
    maxTokens: 32
    compactionRetries: 0

# This focused composition disables the Subagent provider and its Team consumers.
- id: agent-team
  disabled: true

- id: tool-agent-team
  disabled: true

- id: tool-bash
  disabled: true
