# Continuous session-title composition with the shipped all-prompts provider.
- insert:
    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash

# Title-only replay has the same tools on every platform.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
