- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                inputModalities: [text, image]
                contextWindow: 1000000

- id: compaction-basic
  config:
    # The complete initial request stays below 3420 tokens; the image result crosses it.
    thresholdRatio: 0.00342
    headroomTokens: 256
    retainTokens: 64
    maxTokens: 256
